<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地视频播放器</title>
    <style>
        /* 页面基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        /* 播放器外层包裹框 */
        .video-container {
            max-width: 900px;
            width: 100%;
            background-color: #1e1e1e;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        /* 视频标签样式 */
        video {
            width: 100%;
            display: block;
            background-color: #000;
        }

        /* 自定义控制栏布局 */
        .custom-controls {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #2a2a2a;
        }

        /* 按钮与控制组件组合 */
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button, select {
            background-color: #2b2b2b;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        button:hover, select:hover {
            background-color: #00adb5;
            color: #fff;
            border-color: #00adb5;
        }

        /* 音量滑动条样式 */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #aaa;
        }

        input[type="range"] {
            cursor: pointer;
            accent-color: #00adb5;
        }
    </style>
</head>
<body>

    <h2>本地视频播放器</h2>

    <div class="video-container">
        <video id="myVideo" controls poster="cover.jpg">
            <source src="video.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 video 标签，请更换浏览器。
        </video>

        <div class="custom-controls">
            <div class="control-group">
                <button onclick="playPause()">播放/暂停</button>
                <button onclick="skip(-10)">← 快退10秒</button>
                <button onclick="skip(10)">快进10秒 →</button>
            </div>

            <div class="control-group">
                <div class="volume-container">
                    <span>音量</span>
                    <input type="range" id="volume" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)">
                </div>

                <select id="speed" onchange="changeSpeed(this.value)">
                    <option value="0.5">0.5x 倍速</option>
                    <option value="1.0" selected>1.0x 正常</option>
                    <option value="1.5">1.5x 倍速</option>
                    <option value="2.0">2.0x 倍速</option>
                </select>

                <button onclick="toggleFullScreen()">全屏</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');

        // 1. 播放与暂停切换
        function playPause() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // 2. 快进与快退
        function skip(value) {
            video.currentTime += value;
        }

        // 3. 调节音量
        function setVolume(value) {
            video.volume = value;
        }

        // 4. 修改播放速度
        function changeSpeed(value) {
            video.playbackRate = parseFloat(value);
        }

        // 5. 网页全屏切换
        function toggleFullScreen() {
            const container = document.querySelector('.video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.log(`全屏失败: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
